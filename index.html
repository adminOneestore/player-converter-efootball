<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Player Converter | Oneestore</title>
<meta name="theme-color" content="#0f0f0f" />
<link rel="manifest" href="/manifest.json" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424;
    --border: #2e2e2e; --accent: #7fff6a; --accent-dim: #3d6635;
    --text: #f0f0f0; --muted: #888; --radius: 12px; --radius-sm: 8px;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 0 0 80px; }
  header { padding: 20px 20px 0; display: flex; align-items: center; gap: 10px; }
  .logo { width: 36px; height: 36px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .logo-text h1 { font-size: 16px; font-weight: 600; color: var(--text); }
  .logo-text p { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .badge-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 16px 20px 4px; scrollbar-width: none; }
  .badge-scroll::-webkit-scrollbar { display: none; }
  .badge { flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge b { color: var(--accent); }
  .card { margin: 16px 20px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .card label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 10px; }
  textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; font-family: inherit; padding: 12px; resize: none; min-height: 140px; line-height: 1.7; transition: border-color 0.15s; }
  textarea:focus { outline: none; border-color: var(--accent-dim); }
  textarea::placeholder { color: #555; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  button { font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: pointer; font-family: inherit; transition: all 0.1s; }
  button:active { transform: scale(0.97); }
  .btn-accent { background: var(--accent); color: #0f0f0f; border-color: var(--accent); flex: 1; }
  .btn-accent:hover { background: #9fffaa; }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .output-wrap { margin-top: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; min-height: 80px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: var(--text); transition: border-color 0.15s; }
  .output-wrap.has-content { border-color: var(--accent-dim); }
  .output-empty { color: #555; font-style: italic; font-size: 13px; }
  .loading { color: var(--muted); font-size: 13px; font-style: italic; }
  .stats { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .stat-text { font-size: 12px; color: var(--muted); }
  .pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: #1a2e18; color: var(--accent); border: 1px solid var(--accent-dim); }
  .copy-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #0f0f0f; font-size: 13px; font-weight: 700; padding: 10px 20px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 99; }
  .copy-toast.show { opacity: 1; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="logo">⚡</div>
  <div class="logo-text">
    <h1>Player Converter</h1>
    <p>oneestore.efootball</p>
  </div>
</header>

<div class="badge-scroll" id="badge-row"></div>

<div class="card">
  <label>Input — paste satu baris atau banyak baris</label>
  <textarea id="inp" placeholder="B beckham rashford S messi isak NE hazard bergkamp M BECKEN&#10;&#10;Atau paste terus format lengkap dengan email, rm, silog — AI akan extract player je"></textarea>
  <div class="btn-row">
    <button class="btn-accent" id="convertBtn" onclick="convert()">Convert</button>
    <button class="btn-ghost" onclick="clearAll()">Clear</button>
  </div>
</div>

<div class="card">
  <label>Output — nama penuh (satu player satu baris)</label>
  <div class="output-wrap output-empty" id="out">Hasil keluar sini...</div>
  <div class="stats" id="stats"></div>
  <div class="btn-row" style="margin-top:10px;">
    <button class="btn-ghost" style="flex:1;" onclick="copyResult()">Salin semua</button>
  </div>
</div>

<div class="copy-toast" id="toast">Tersalin!</div>

<script>
const MAP = {
  'S':'SHWTIME','B':'BIGTIME','BL':'BLUELOCK',
  'TS':'TSUBASA','NE':'NEW EPIC','E':'EPIC',
  'OE':'OLD EPIC','N':'NOSTALGIA','P':'PACK','M':'MANAGER'
};

const SYSTEM_PROMPT = `Tugas kau hanya satu: tukar senarai nama player yang ada singkatan kategori kepada senarai penuh kategori.
Jangan buat ayat lain. Jangan tambah info lain. Jangan ubah susunan. Hanya output list sahaja, tiada preamble, tiada explanation.

Kategori:
S = SHWTIME
NE = NEW EPIC
E = EPIC
B = BIGTIME
M = MANAGER
N = NOSTALGIA
OE = OLD EPIC
BL = BLUELOCK
TS = TSUBASA
P = PACK

Format Wajib:
KATEGORI_PENUH + SPACE + NAMA_PLAYER (uppercase)

Contoh:
Input: S messi neves NE hazard E becken M AMORIM
Output:
SHWTIME MESSI
SHWTIME NEVES
NEW EPIC HAZARD
EPIC BECKEN
MANAGER AMORIM

Penting:
- Ignore semua benda lain dalam input (email, nombor telefon, rm, silog, nama buyer dll)
- Hanya extract nama player dengan kategori je
- Output satu player satu baris
- Semua uppercase`;

const badgeRow = document.getElementById('badge-row');
Object.entries(MAP).forEach(([k,v]) => {
  const b = document.createElement('span');
  b.className = 'badge';
  b.innerHTML = `<b>${k}</b> → ${v}`;
  badgeRow.appendChild(b);
});

async function convert() {
  const inp = document.getElementById('inp').value.trim();
  const outEl = document.getElementById('out');
  const statsEl = document.getElementById('stats');
  const btn = document.getElementById('convertBtn');

  if (!inp) {
    outEl.textContent = 'Hasil keluar sini...';
    outEl.className = 'output-wrap output-empty';
    statsEl.innerHTML = '';
    return;
  }

  // Loading state
  btn.disabled = true;
  btn.textContent = 'Converting...';
  outEl.textContent = 'AI sedang proses...';
  outEl.className = 'output-wrap loading';
  statsEl.innerHTML = '';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: inp }]
      })
    });

    const data = await response.json();
    const result = data.content[0].text.trim();

    outEl.textContent = result;
    outEl.className = 'output-wrap has-content';

    // Count players
    const lines = result.split('\n').filter(l => l.trim());
    const catCount = {};
    lines.forEach(r => {
      const parts = r.split(' ');
      const cat = (parts[0] === 'NEW' || parts[0] === 'OLD') ? `${parts[0]} ${parts[1]}` : parts[0];
      catCount[cat] = (catCount[cat] || 0) + 1;
    });

    let html = `<span class="stat-text">${lines.length} player ditukar</span>`;
    Object.entries(catCount).forEach(([cat, count]) => {
      html += `<span class="pill">${cat} ×${count}</span>`;
    });
    statsEl.innerHTML = html;

  } catch (err) {
    outEl.textContent = 'Error: ' + err.message;
    outEl.className = 'output-wrap output-empty';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Convert';
  }
}

function copyResult() {
  const out = document.getElementById('out');
  if (out.classList.contains('output-empty') || out.classList.contains('loading')) return;
  navigator.clipboard.writeText(out.textContent).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  });
}

function clearAll() {
  document.getElementById('inp').value = '';
  const outEl = document.getElementById('out');
  outEl.textContent = 'Hasil keluar sini...';
  outEl.className = 'output-wrap output-empty';
  document.getElementById('stats').innerHTML = '';
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
